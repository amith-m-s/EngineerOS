name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly security scan

jobs:
  # Backend Testing
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engineeros
          POSTGRES_PASSWORD: engineeros
          POSTGRES_DB: engineeros
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend unit tests
        run: |
          cd backend
          pytest -m unit -v --cov=app --cov-report=xml
        env:
          ENVIRONMENT: testing
          JWT_SECRET_KEY: test-secret-key

      - name: Run backend integration tests
        run: |
          cd backend
          pytest -m integration -v
        env:
          ENVIRONMENT: testing
          JWT_SECRET_KEY: test-secret-key

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Check test coverage
        run: |
          cd backend
          pytest -m "unit or integration" --cov=app --cov-fail-under=70

  # Frontend Testing
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Run type checking
        run: npm run type-check

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run --coverage
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: frontend
          name: frontend-coverage

  # Code Quality
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          pip install ruff black

      - name: Check Python formatting
        run: |
          black --check backend/app backend/tests

      - name: Lint Python code
        run: |
          ruff check backend/app backend/tests

      - name: Install frontend dependencies
        run: npm install

      - name: Check frontend formatting
        run: npm run format:check

  # Security Scanning
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Scan Python for security issues
        run: |
          bandit -r backend/app -q

      - name: Check Python dependencies
        run: |
          pip install -r backend/requirements.txt
          safety check || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Check npm dependencies
        run: |
          npm audit --audit-level=high

  # Build Docker Images
  build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: engineeros-api:latest

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.frontend
          push: false
          tags: engineeros-web:latest

  # E2E Tests (Optional - runs after build)
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          npm install
          pip install -r backend/requirements.txt

      - name: Start services
        run: |
          docker compose up -d
          sleep 10

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down

  # Report
  report:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, code-quality, security]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "✅ Backend tests: ${{ needs.backend-tests.result }}"
          echo "✅ Frontend tests: ${{ needs.frontend-tests.result }}"
          echo "✅ Code quality: ${{ needs.code-quality.result }}"
          echo "✅ Security: ${{ needs.security.result }}"

      - name: Create summary
        run: |
          echo "## 📊 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
