name: EngineerOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Frontend — Lint, Type-check, Build
  # ───────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --max-warnings 0
        continue-on-error: true

      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3

  # ───────────────────────────────────────────────────────────────────
  # Backend — Lint, Type-check, Test
  # ───────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: testing
      DEBUG: 'true'
      JWT_SECRET_KEY: ci-test-secret-key-never-use-in-production
      POSTGRES_DSN: sqlite:///./ci_test.db
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      - name: Lint (ruff)
        run: ruff check app/ --output-format=github
        continue-on-error: true

      - name: Format check (ruff)
        run: ruff format --check app/
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run tests
        run: |
          pytest tests/ -v \
            --tb=short \
            --junitxml=test-results.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -x
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # Docker — Build & verify image
  # ───────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t engineeros-api:${{ github.sha }} \
            -f backend/Dockerfile \
            backend/

      - name: Verify image health
        run: |
          docker run -d \
            --name engineeros-test \
            -p 8000:8000 \
            -e ENVIRONMENT=testing \
            -e JWT_SECRET_KEY=docker-test-key \
            -e POSTGRES_DSN=sqlite:///./test.db \
            -e NEO4J_URI=bolt://localhost:7687 \
            -e NEO4J_USER=neo4j \
            -e NEO4J_PASSWORD=test \
            -e QDRANT_URL=http://localhost:6333 \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e KAFKA_BOOTSTRAP_SERVERS=localhost:9092 \
            engineeros-api:${{ github.sha }}

          # Wait for startup
          sleep 5

          # Verify health endpoint
          curl -sf http://localhost:8000/health || echo "Health check pending..."

          # Cleanup
          docker stop engineeros-test
          docker rm engineeros-test
