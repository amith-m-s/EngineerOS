[pytest]
# Pytest configuration for EngineerOS backend

asyncio_mode = auto
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts = 
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
    -v
    --tb=short

# Test discovery paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require database/services)
    auth: Authentication tests
    security: Security/authorization tests
    slow: Slow tests (use pytest -m "not slow" to skip)
